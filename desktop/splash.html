<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>FlowSound</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
  html, body {
    width: 100%; height: 100%;
    background: transparent;           /* 窗口透明，圆角卡片浮在桌面上 */
    overflow: hidden;
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
  }
  .card {
    width: 100%; height: 100%;
    background: linear-gradient(160deg, #101018 0%, #0b0b12 60%, #0d0a16 100%);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 22px;
    box-shadow: 0 18px 60px rgba(0, 0, 0, 0.55);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    animation: card-in 0.45s cubic-bezier(0.22, 1, 0.36, 1) both;
  }
  @keyframes card-in {
    from { opacity: 0; transform: scale(0.94); }
    to   { opacity: 1; transform: scale(1); }
  }

  /* 图标 + 呼吸光晕 */
  .icon-wrap { position: relative; width: 72px; height: 72px; }
  .icon-glow {
    position: absolute; inset: -14px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(124, 92, 246, 0.35) 0%, rgba(124, 92, 246, 0) 70%);
    animation: glow 2.4s ease-in-out infinite;
  }
  @keyframes glow {
    0%, 100% { opacity: 0.55; transform: scale(0.9); }
    50%      { opacity: 1;    transform: scale(1.08); }
  }
  .icon {
    position: relative;
    width: 60px; height: 60px;
    border-radius: 15px;
    animation: float 3s ease-in-out infinite;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-5px); }
  }
  /* 图标缺失时的兜底：内联均衡器图形 */
  .icon-fallback {
    position: relative;
    width: 60px; height: 60px;
    border-radius: 15px;
    background: linear-gradient(135deg, #7c5cf6, #c44cf0);
    display: none;
    align-items: flex-end; justify-content: center;
    gap: 6px; padding: 16px 14px;
    animation: float 3s ease-in-out infinite;
  }

  .brand {
    margin-top: 20px;
    font-size: 27px; font-weight: 700; letter-spacing: 0.5px;
    background: linear-gradient(92deg, #a78bfa 0%, #8b7bff 45%, #d08bff 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: rise 0.5s 0.1s cubic-bezier(0.22, 1, 0.36, 1) both;
  }
  .tagline {
    margin-top: 8px;
    font-size: 12.5px; color: rgba(255, 255, 255, 0.52); letter-spacing: 2px;
    animation: rise 0.5s 0.2s cubic-bezier(0.22, 1, 0.36, 1) both;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* 均衡器律动 */
  .eq {
    margin-top: 18px; height: 18px;
    display: flex; align-items: flex-end; gap: 4px;
    animation: rise 0.5s 0.3s cubic-bezier(0.22, 1, 0.36, 1) both;
  }
  .eq span {
    width: 4px; border-radius: 2px;
    background: linear-gradient(to top, #7c5cf6, #c44cf0);
    animation: bounce 1.1s ease-in-out infinite;
  }
  .eq span:nth-child(1) { animation-delay: 0s;    height: 8px; }
  .eq span:nth-child(2) { animation-delay: 0.15s; height: 14px; }
  .eq span:nth-child(3) { animation-delay: 0.3s;  height: 18px; }
  .eq span:nth-child(4) { animation-delay: 0.45s; height: 12px; }
  .eq span:nth-child(5) { animation-delay: 0.6s;  height: 9px; }
  @keyframes bounce {
    0%, 100% { transform: scaleY(0.45); }
    50%      { transform: scaleY(1); }
  }

  /* 底部不定长进度条 */
  .bar {
    position: absolute; left: 34px; right: 34px; bottom: 30px;
    height: 3px; border-radius: 2px;
    background: rgba(255, 255, 255, 0.07);
    overflow: hidden;
    animation: rise 0.5s 0.4s cubic-bezier(0.22, 1, 0.36, 1) both;
  }
  .bar i {
    position: absolute; height: 100%; width: 40%;
    border-radius: 2px;
    background: linear-gradient(90deg, rgba(124, 92, 246, 0), #8b7bff, rgba(196, 76, 240, 0));
    animation: slide 1.4s ease-in-out infinite;
  }
  @keyframes slide {
    from { left: -40%; }
    to   { left: 100%; }
  }
</style>
</head>
<body>
  <div class="card">
    <div class="icon-wrap">
      <div class="icon-glow"></div>
      <img class="icon" alt="" id="icon">
      <div class="icon-fallback" id="icon-fallback">
        <span class="eq" style="margin:0;animation:none;height:100%;align-items:flex-end;gap:5px;">
          <span style="height:60%;animation-delay:0s"></span>
          <span style="height:100%;animation-delay:0.15s"></span>
          <span style="height:75%;animation-delay:0.3s"></span>
          <span style="height:90%;animation-delay:0.45s"></span>
        </span>
      </div>
    </div>
    <div class="brand">FlowSound</div>
    <div class="tagline">让音乐流动起来</div>
    <div class="eq">
      <span></span><span></span><span></span><span></span><span></span>
    </div>
    <div class="bar"><i></i></div>
  </div>
  <script>
    // 主进程经 query 传入应用图标路径（打包后在 resources，开发在 desktop/build）
    (function () {
      var p = new URLSearchParams(location.search).get("icon");
      var img = document.getElementById("icon");
      if (!p) { img.remove(); document.getElementById("icon-fallback").style.display = "flex"; return; }
      img.src = "file:///" + p.replace(/\\/g, "/").replace(/^\/+/, "");
      img.onerror = function () {
        img.remove();
        document.getElementById("icon-fallback").style.display = "flex";
      };
    })();
  </script>
</body>
</html>
